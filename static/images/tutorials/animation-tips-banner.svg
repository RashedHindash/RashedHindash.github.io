<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800"
     role="img" aria-label="A bouncing ball arc with spacing marks">
  <defs>
    <!-- Warm backdrop sampled from the Foundation and Body Mechanics banners -->
    <radialGradient id="bg" cx="46%" cy="34%" r="82%">
      <stop offset="0"   stop-color="#71554f"/>
      <stop offset="46%" stop-color="#5b4342"/>
      <stop offset="100%" stop-color="#352626"/>
    </radialGradient>

    <!-- Matte teal, shaded to sit alongside the rendered rigs -->
    <radialGradient id="ball" cx="34%" cy="30%" r="76%">
      <stop offset="0"   stop-color="#8fd8cb"/>
      <stop offset="38%" stop-color="#3f9a92"/>
      <stop offset="100%" stop-color="#14484a"/>
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8a6a63" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#8a6a63" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0"   stop-color="#241a1a" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#241a1a" stop-opacity="0"/>
    </radialGradient>

    <g id="ballMark">
      <circle r="22" fill="url(#ball)"/>
      <ellipse cx="-7.5" cy="-8.5" rx="6.5" ry="4.6" fill="#c6efe6" opacity=".5"/>
    </g>
  </defs>

  <rect width="1440" height="800" fill="url(#bg)"/>

  <!-- A hint of viewport floor, like the rig renders -->
  <rect x="0" y="470" width="1440" height="180" fill="url(#floor)"/>
  <g stroke="#a08079" stroke-opacity=".13" stroke-width="1.4">
    <path d="M0 620h1440M0 560h1440M0 512h1440M0 476h1440"/>
    <path d="M120 476v144M340 476v144M560 476v144M780 476v144M1000 476v144M1220 476v144"/>
  </g>

  <!-- Contact shadows -->
  <g>
    <ellipse cx="180" cy="628" rx="52" ry="11" fill="url(#shadow)"/>
    <ellipse cx="620" cy="628" rx="46" ry="10" fill="url(#shadow)"/>
    <ellipse cx="980" cy="628" rx="38" ry="9"  fill="url(#shadow)"/>
    <ellipse cx="1220" cy="628" rx="32" ry="8" fill="url(#shadow)"/>
  </g>

  <!-- The arc itself -->
  <path d="M180 620 Q290 320 400 370 Q510 320 620 620 Q710 430 800 460
           Q890 430 980 620 Q1040 500 1100 525 Q1160 500 1220 620 L1330 620"
        fill="none" stroke="#d8b7ad" stroke-opacity=".26"
        stroke-width="2.4" stroke-dasharray="9 11" stroke-linecap="round"/>

  <!-- Spacing ticks: wide apart through the fast pass, tight at the apex -->
  <g stroke="#e4c6bc" stroke-opacity=".3" stroke-width="1.6" stroke-linecap="round">
    <path d="M180 664v16M240 664v16M300 664v16M350 664v16M400 664v16
             M450 664v16M500 664v16M560 664v16M620 664v16
             M680 664v16M740 664v16M800 664v16M860 664v16M920 664v16M980 664v16"/>
  </g>

  <!-- Bounce one -->
  <ellipse cx="180" cy="606" rx="29" ry="16" fill="url(#ball)"/>
  <use href="#ballMark" x="240" y="502"/>
  <use href="#ballMark" x="300" y="422"/>
  <use href="#ballMark" x="350" y="383"/>
  <use href="#ballMark" x="400" y="370"/>
  <use href="#ballMark" x="450" y="383"/>
  <use href="#ballMark" x="500" y="422"/>
  <use href="#ballMark" x="560" y="502"/>

  <!-- Bounce two -->
  <ellipse cx="620" cy="606" rx="27" ry="16" fill="url(#ball)"/>
  <use href="#ballMark" x="680" y="531"/>
  <use href="#ballMark" x="740" y="478"/>
  <use href="#ballMark" x="800" y="460"/>
  <use href="#ballMark" x="860" y="478"/>
  <use href="#ballMark" x="920" y="531"/>

  <!-- Bounce three, settling -->
  <ellipse cx="980" cy="608" rx="25" ry="17" fill="url(#ball)"/>
  <use href="#ballMark" x="1030" y="560"/>
  <use href="#ballMark" x="1100" y="525"/>
  <use href="#ballMark" x="1170" y="560"/>
  <ellipse cx="1220" cy="610" rx="23" ry="18" fill="url(#ball)"/>
  <use href="#ballMark" x="1300" y="598"/>

  <!-- Vignette, to match the falloff on the rendered banners -->
  <rect width="1440" height="800" fill="none"/>
  <radialGradient id="vig" cx="50%" cy="45%" r="72%">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".34"/>
  </radialGradient>
  <rect width="1440" height="800" fill="url(#vig)"/>
</svg>
