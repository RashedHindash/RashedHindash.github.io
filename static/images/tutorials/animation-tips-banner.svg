<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 504" width="1440" height="504"
     role="img" aria-label="A bouncing ball arc with spacing marks">
  <defs>
    <!-- Backdrop sampled from the Foundation and Body Mechanics banners -->
    <radialGradient id="bg" cx="44%" cy="32%" r="88%">
      <stop offset="0"    stop-color="#74574f"/>
      <stop offset="45%"  stop-color="#5b4342"/>
      <stop offset="100%" stop-color="#332525"/>
    </radialGradient>

    <!-- Matte teal, shaded to sit next to the rendered rigs -->
    <radialGradient id="ball" cx="34%" cy="29%" r="78%">
      <stop offset="0"    stop-color="#93dbce"/>
      <stop offset="38%"  stop-color="#3f9a92"/>
      <stop offset="100%" stop-color="#14484a"/>
    </radialGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8a6a63" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#8a6a63" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#241a1a" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#241a1a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="50%" cy="44%" r="74%">
      <stop offset="52%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".36"/>
    </radialGradient>

    <g id="b">
      <circle r="19" fill="url(#ball)"/>
      <ellipse cx="-6.4" cy="-7.2" rx="5.6" ry="4" fill="#c6efe6" opacity=".5"/>
    </g>
  </defs>

  <rect width="1440" height="504" fill="url(#bg)"/>

  <!-- A hint of viewport floor, echoing the rig renders -->
  <rect x="0" y="292" width="1440" height="112" fill="url(#floor)"/>
  <g stroke="#a08079" stroke-opacity=".12" stroke-width="1.3">
    <path d="M0 388h1440M0 366h1440M0 340h1440M0 300h1440"/>
    <path d="M110 300v88M330 300v88M550 300v88M770 300v88M990 300v88M1210 300v88"/>
  </g>

  <!-- Contact shadows -->
  <g>
    <ellipse cx="170"  cy="396" rx="46" ry="9" fill="url(#shadow)"/>
    <ellipse cx="610"  cy="396" rx="40" ry="8" fill="url(#shadow)"/>
    <ellipse cx="970"  cy="396" rx="33" ry="7" fill="url(#shadow)"/>
    <ellipse cx="1210" cy="396" rx="28" ry="6" fill="url(#shadow)"/>
  </g>

  <!-- The arc -->
  <path d="M170 388 Q280 96 390 145 Q500 96 610 388 Q700 210 790 240
           Q880 210 970 388 Q1030 268 1090 312 Q1150 268 1210 388 L1320 388"
        fill="none" stroke="#d8b7ad" stroke-opacity=".24"
        stroke-width="2.2" stroke-dasharray="8 10" stroke-linecap="round"/>

  <!-- Spacing ticks: wide through the fast pass, tight at the apex -->
  <g stroke="#e4c6bc" stroke-opacity=".26" stroke-width="1.5" stroke-linecap="round">
    <path d="M170 410v13M225 410v13M280 410v13M335 410v13M390 410v13
             M445 410v13M500 410v13M555 410v13M610 410v13
             M655 410v13M700 410v13M745 410v13M790 410v13
             M835 410v13M880 410v13M925 410v13M970 410v13"/>
  </g>

  <!-- Bounce one -->
  <ellipse cx="170" cy="376" rx="25" ry="13" fill="url(#ball)"/>
  <use href="#b" x="225" y="282"/>
  <use href="#b" x="280" y="206"/>
  <use href="#b" x="335" y="160"/>
  <use href="#b" x="390" y="145"/>
  <use href="#b" x="445" y="160"/>
  <use href="#b" x="500" y="206"/>
  <use href="#b" x="555" y="282"/>

  <!-- Bounce two -->
  <ellipse cx="610" cy="376" rx="23" ry="13" fill="url(#ball)"/>
  <use href="#b" x="655" y="323"/>
  <use href="#b" x="700" y="277"/>
  <use href="#b" x="745" y="249"/>
  <use href="#b" x="790" y="240"/>
  <use href="#b" x="835" y="249"/>
  <use href="#b" x="880" y="277"/>
  <use href="#b" x="925" y="323"/>

  <!-- Bounce three, settling -->
  <ellipse cx="970" cy="377" rx="21" ry="14" fill="url(#ball)"/>
  <use href="#b" x="1010" y="346"/>
  <use href="#b" x="1050" y="320"/>
  <use href="#b" x="1090" y="312"/>
  <use href="#b" x="1130" y="320"/>
  <use href="#b" x="1170" y="346"/>
  <ellipse cx="1210" cy="378" rx="20" ry="15" fill="url(#ball)"/>
  <use href="#b" x="1290" y="371"/>

  <rect width="1440" height="504" fill="url(#vig)"/>
</svg>
