<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900"
     role="img" aria-label="Hand-drawn spacing chart and curve editor sketch with notes">
  <!--
    Drawn to sit with the Foundation and Body Mechanics banners: white paper,
    grey pencil line work, handwritten notes with asterisk bullets.
    Everything lives inside y=190..710 so it survives both crops - the 16:9
    category card and the much wider banner band on the category page.
  -->
  <defs>
    <!-- A sketched circle: deliberately not closed, with a little overshoot -->
    <g id="k">
      <path d="M-12.6 0.8 C-12.9-6.9 -7.1-12.8 0.9-13.1 C8.6-13.3 13.2-6.6 12.9 0.9
               C12.7 8.4 7.2 13.1 -0.7 13.2 C-8.2 13.3 -12.4 8.2 -12.6 0.6
               C-12.7-1.1 -12.3-3.2 -11.7-4.7"
            fill="none" stroke="#6b6b6b" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    .ink   { fill:none; stroke:#5f5f5f; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .ink2  { fill:none; stroke:#2f2f2f; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    .faint { fill:none; stroke:#9a9a9a; stroke-width:1.6; stroke-linecap:round; }
    .note  { fill:#242424; font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;
             font-size:26px; }
    .num   { fill:#8a8a8a; font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;
             font-size:19px; }
    .dot   { fill:#2f2f2f; }
  </style>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- ============ left: spacing chart, slow in and slow out ============ -->

  <!-- ground line, drawn with a slight waver like a ruled pencil line -->
  <path class="ink" d="M96 521 C210 518 320 524 430 520 S560 523 634 520"/>

  <!-- keys: bunched at both ends, spread through the middle -->
  <use href="#k" x="100" y="521"/><use href="#k" x="107" y="521"/>
  <use href="#k" x="129" y="521"/><use href="#k" x="163" y="521"/>
  <use href="#k" x="208" y="521"/><use href="#k" x="261" y="521"/>
  <use href="#k" x="320" y="521"/><use href="#k" x="380" y="521"/>
  <use href="#k" x="439" y="521"/><use href="#k" x="492" y="521"/>
  <use href="#k" x="537" y="521"/><use href="#k" x="571" y="521"/>
  <use href="#k" x="593" y="521"/><use href="#k" x="600" y="521"/>

  <!-- tick marks under the chart -->
  <g class="faint">
    <path d="M100 549v22M107 549v18M129 549v22M163 549v18M208 549v22M261 549v18
             M320 549v22M380 549v18M439 549v22M492 549v18M537 549v22M571 549v18
             M593 549v22M600 549v18"/>
  </g>

  <!-- a few handwritten frame numbers, not all of them -->
  <text class="num" x="94"  y="487">1</text>
  <text class="num" x="200" y="487">5</text>
  <text class="num" x="373" y="487">8</text>
  <text class="num" x="528" y="487">11</text>
  <text class="num" x="592" y="487">14</text>

  <text class="note" x="96" y="628">* slow in, slow out &#8212; the spacing is the timing</text>

  <!-- ============ right: a sketched curve editor ============ -->

  <!-- axes -->
  <path class="ink2" d="M812 268 C810 340 813 470 811 600"/>
  <path class="ink2" d="M806 598 C900 600 1120 596 1338 599"/>

  <!-- the ease curve: flat, fast, flat -->
  <path class="ink2" d="M838 566 C905 566 940 560 985 505 C1050 425 1105 350 1170 322
                        C1225 298 1270 296 1322 297"/>

  <!-- tangent handles, drawn flat to show a hold at each end -->
  <path class="faint" d="M800 566h86M1276 297h84"/>
  <circle class="dot" cx="800" cy="566" r="4.4"/>
  <circle class="dot" cx="886" cy="566" r="4.4"/>
  <circle class="dot" cx="1276" cy="297" r="4.4"/>
  <circle class="dot" cx="1360" cy="297" r="4.4"/>

  <!-- keyframes -->
  <path class="ink2" d="M838 558l8 8-8 8-8-8z" fill="#2f2f2f"/>
  <path class="ink2" d="M1322 289l8 8-8 8-8-8z" fill="#2f2f2f"/>

  <!-- an arrow pointing at the flat tangent, the way you'd scribble it in -->
  <path class="faint" d="M1150 560 C1090 566 1010 572 926 570"/>
  <path class="faint" d="M948 561l-22 9 21 10"/>

  <text class="note" x="1042" y="548">* flatten the tangents</text>
  <text class="note" x="1042" y="580">&#160;&#160;to hold a pose</text>

  <text class="note" x="812" y="668">* favour the extremes &#8212; the in-betweens follow</text>
</svg>
