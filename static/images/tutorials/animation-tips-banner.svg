<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900"
     role="img" aria-label="Hand-drawn animation notes: an arc, a spacing chart and a curve editor">
  <!--
    Drawn to sit with the Foundation and Body Mechanics banners: white paper,
    pencil line work, handwritten notes with asterisk bullets.
    Composition fills the frame and keeps every note clear of the right edge,
    so nothing clips in either crop (16:9 card, wide banner band).
  -->
  <defs>
    <!-- A sketched circle: not quite closed, with a little pencil overshoot -->
    <g id="k">
      <path d="M-17 1 C-17.4-9.3 -9.6-17.3 1.2-17.7 C11.6-18 17.8-8.9 17.4 1.2
               C17.1 11.3 9.7 17.7 -0.9 17.8 C-11 18 -16.7 11.1 -17 0.8
               C-17.1-1.5 -16.6-4.3 -15.8-6.3"
            fill="none" stroke="#6b6b6b" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="ks">
      <path d="M-13.5 0.8 C-13.8-7.4 -7.6-13.8 0.9-14.1 C9.2-14.3 14.1-7.1 13.8 1
               C13.6 9 7.7 14.1 -0.7 14.2 C-8.8 14.3 -13.3 8.8 -13.5 0.6
               C-13.6-1.2 -13.2-3.4 -12.6-5"
            fill="none" stroke="#6b6b6b" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    .ink   { fill:none; stroke:#5f5f5f; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .ink2  { fill:none; stroke:#2f2f2f; stroke-width:2.7; stroke-linecap:round; stroke-linejoin:round; }
    .faint { fill:none; stroke:#9a9a9a; stroke-width:1.8; stroke-linecap:round; }
    .note  { fill:#242424; font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;
             font-size:27px; }
    .num   { fill:#8a8a8a; font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;
             font-size:20px; }
    .dot   { fill:#2f2f2f; }
  </style>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- ================= top left: arcs ================= -->

  <!-- the path, sketched twice so it reads as pencil -->
  <path class="ink" d="M112 402 C190 262 268 196 336 200 C404 204 486 276 560 400"/>
  <path class="faint" d="M116 398 C194 260 270 202 336 205 C402 208 482 278 556 396"/>

  <use href="#ks" x="112" y="402"/>
  <use href="#ks" x="163" y="316"/>
  <use href="#ks" x="228" y="243"/>
  <use href="#ks" x="300" y="205"/>
  <use href="#ks" x="372" y="212"/>
  <use href="#ks" x="444" y="264"/>
  <use href="#ks" x="510" y="338"/>
  <use href="#ks" x="560" y="402"/>

  <!-- a straight line struck through, the wrong way to do it -->
  <path class="faint" d="M112 402 L560 402"/>
  <path class="faint" d="M300 372l24 24M324 372l-24 24"/>

  <text class="note" x="108" y="470">* arcs, not straight lines</text>

  <!-- ================= bottom left: spacing chart ================= -->

  <path class="ink" d="M96 652 C230 649 380 655 520 651 S660 654 706 651"/>

  <use href="#k" x="110" y="651"/><use href="#k" x="118" y="651"/>
  <use href="#k" x="143" y="651"/><use href="#k" x="183" y="651"/>
  <use href="#k" x="235" y="651"/><use href="#k" x="297" y="651"/>
  <use href="#k" x="365" y="651"/><use href="#k" x="435" y="651"/>
  <use href="#k" x="503" y="651"/><use href="#k" x="565" y="651"/>
  <use href="#k" x="617" y="651"/><use href="#k" x="657" y="651"/>
  <use href="#k" x="682" y="651"/><use href="#k" x="690" y="651"/>

  <g class="faint">
    <path d="M110 684v24M118 684v18M143 684v24M183 684v18M235 684v24M297 684v18
             M365 684v24M435 684v18M503 684v24M565 684v18M617 684v24M657 684v18
             M682 684v24M690 684v18"/>
  </g>

  <text class="num" x="102" y="612">1</text>
  <text class="num" x="226" y="612">5</text>
  <text class="num" x="428" y="612">8</text>
  <text class="num" x="608" y="612">11</text>
  <text class="num" x="680" y="612">14</text>

  <text class="note" x="100" y="762">* slow in, slow out</text>

  <!-- ================= right: a sketched curve editor ================= -->

  <path class="ink2" d="M842 214 C840 300 843 470 841 646"/>
  <path class="ink2" d="M834 644 C930 646 1160 642 1372 645"/>

  <!-- flat, fast, flat -->
  <path class="ink2" d="M872 604 C944 604 982 598 1030 538 C1098 452 1156 372 1224 342
                        C1282 316 1330 314 1344 313"/>

  <!-- tangent handles, drawn flat to show the hold at each end -->
  <path class="faint" d="M834 604h92M1268 313h94"/>
  <circle class="dot" cx="834" cy="604" r="4.8"/>
  <circle class="dot" cx="926" cy="604" r="4.8"/>
  <circle class="dot" cx="1268" cy="313" r="4.8"/>
  <circle class="dot" cx="1362" cy="313" r="4.8"/>

  <!-- keyframes -->
  <path d="M872 595l9 9-9 9-9-9z" fill="#2f2f2f"/>
  <path d="M1344 304l9 9-9 9-9-9z" fill="#2f2f2f"/>

  <!-- a scribbled pointer at the flat tangent -->
  <path class="faint" d="M1146 566 C1082 574 1010 586 962 600"/>
  <path class="faint" d="M986 588l-24 12 22 11"/>

  <text class="note" x="1010" y="238">* favour the extremes</text>
  <text class="note" x="1010" y="272">&#160;&#160;the in-betweens follow</text>

  <text class="note" x="1046" y="556">* flatten tangents</text>
  <text class="note" x="1046" y="590">&#160;&#160;to hold a pose</text>

  <text class="note" x="838" y="762">* spacing is timing</text>
</svg>
